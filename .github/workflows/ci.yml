#fmt + clippy + tests on the oldest supported floor (gtk 4.14 / adw 1.5 on ubuntu 24.04),
#plus a job pinned to the rust-version so the msrv claim stays honest
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Integration (real binaries, fake flatpak/xdg-mime)
        run: cargo build --workspace --locked && docker/integration.sh target/debug

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      #plain cargo-audit instead of rustsec/audit-check. that one wants to post a check run, which
      #the default token cant do ("Resource not accessible by integration") n fork prs never could
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
